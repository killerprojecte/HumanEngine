name: Container
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Identify candidate
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and load candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=HumanEngine
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify exact candidate with Compose
        env:
          HUMANENGINE_IMAGE: ${{ steps.image.outputs.tag }}
        run: node scripts/container-smoke.mjs "$HUMANENGINE_IMAGE"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image and verify registry digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')"
          docker push "$IMAGE_TAG"
          digest="$(docker image inspect "$IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          docker pull "$digest"
          test "$(docker image inspect "$digest" --format '{{.Id}}')" = "$expected"
          docker tag "$IMAGE_TAG" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"
          {
            echo '## Verified container'
            echo "- Commit: $GITHUB_SHA"
            echo "- Tested tag: $IMAGE_TAG"
            echo "- Immutable pull reference: $digest"
            echo '- Platform: linux/amd64; native SQLite, sqlite-vec and sharp exercised inside the image.'
            echo '- No package visibility changes or application deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
