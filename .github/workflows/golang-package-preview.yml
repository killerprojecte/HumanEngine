name: Go packaged runtime preview
on:
  workflow_dispatch:
    inputs:
      operator_candidate:
        description: Exercise the same external-only image in Chromium and Compose rollback
        type: boolean
        default: false
  push:
    branches: [feat/refactor-golang]
    paths:
      - 'backend/**'
      - 'package-lock.json'
      - '.github/workflows/golang-package-preview.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'package-lock.json'
      - '.github/workflows/golang-package-preview.yml'
permissions:
  contents: read
jobs:
  package-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Detect focused package proofs
        id: proofs
        env:
          BEFORE: ${{ github.event.before }}
          OPERATOR_CANDIDATE: ${{ inputs.operator_candidate }}
        run: bash backend/packaging/runtime-preview/select-proofs.sh >> "$GITHUB_OUTPUT"
      - name: Check acceptance driver and Compose configuration
        env:
          HUMANENGINE_ADMIN_TOKEN: synthetic-package-token
          HE_COMPOSE_IMAGE: humanengine-go-preview:local
        run: |
          python3 -m unittest discover -s backend/packaging/runtime-preview -p 'test_*.py' -v
          docker compose -f backend/packaging/runtime-preview/compose.yaml config --quiet
          set -o pipefail
          env -u HE_COMPOSE_PORT docker compose --env-file /dev/null -f backend/packaging/runtime-preview/compose-rehearsal.yaml config --format json |
            python3 -c 'import json, sys; c = json.load(sys.stdin); p, = c["services"]["humanengine"]["ports"]; assert c["name"] == "humanengine-go-local" and p["host_ip"] == "127.0.0.1" and int(p["published"]) == 3002'
      - name: Build opt-in candidate (no push)
        run: docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" -f backend/packaging/runtime-preview/Dockerfile -t humanengine-go-preview:local .
      - name: Verify opt-in host excludes SnowLuma (no push)
        id: external-host
        if: steps.proofs.outputs.standalone == 'true' || steps.proofs.outputs.restore == 'true' || steps.proofs.outputs.compose == 'true'
        run: |
          set -o pipefail
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg PREVIEW_PLUGIN_PROFILE=without-snowluma -f backend/packaging/runtime-preview/Dockerfile \
            -t humanengine-go-external:local .
          docker run --rm --network none humanengine-go-external:local --inspect-builtins |
            python3 -c 'import json, sys; rows = json.load(sys.stdin); assert [(p["id"], p["apiVersion"]) for p in rows] == [("typing-delay", 2), ("web-read", 2), ("web-search", 2)]'
      - uses: actions/setup-go@v6
        if: steps.proofs.outputs.restore == 'true' || steps.proofs.outputs.compose == 'true' || steps.proofs.outputs.bind == 'true' || steps.proofs.outputs.browser == 'true'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build the separate SnowLuma test package
        id: snow-package
        if: steps.proofs.outputs.restore == 'true' || steps.proofs.outputs.compose == 'true'
        run: make -C backend wasm-snowluma-http-preview SNOW_HTTP_PACKAGE_DIR="$RUNNER_TEMP/snowluma-preview"
      - name: Build the operator candidate without embedded plugins (no push)
        if: steps.proofs.outputs.bind == 'true' || steps.proofs.outputs.browser == 'true'
        run: |
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg PREVIEW_PLUGIN_PROFILE=external-only -f backend/packaging/runtime-preview/Dockerfile \
            -t humanengine-operator-candidate:local .
          dir="$RUNNER_TEMP/operator-plugins"
          make -C backend wasm-snowluma-http-preview SNOW_HTTP_PACKAGE_DIR="$dir"
          make -C backend wasm-typing-delay-package TYPING_DELAY_PACKAGE_DIR="$dir"
          make -C backend wasm-web-read-request-package WEB_READ_REQUEST_PACKAGE_DIR="$dir"
          make -C backend wasm-web-search-structured-package WEB_SEARCH_PROFILE=routed-profile.json WEB_SEARCH_STRUCTURED_PACKAGE_DIR="$dir"
      - name: Select Python for the opt-in browser smoke
        if: steps.proofs.outputs.browser == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the pinned host Playwright driver
        if: steps.proofs.outputs.browser == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/humanengine-browser-venv"
          py="$RUNNER_TEMP/humanengine-browser-venv/bin/python"
          "$py" -m pip install --require-hashes --only-binary :all: -r backend/packaging/runtime-preview/browser-requirements.txt
      - name: Exercise actual packaged startup, HTTP, drain and V1 lifecycle
        env:
          RUN_BROWSER_SMOKE: ${{ steps.proofs.outputs.browser == 'true' }}
        run: |
          if [ "$RUN_BROWSER_SMOKE" = true ]; then
            "$RUNNER_TEMP/humanengine-browser-venv/bin/python" backend/packaging/runtime-preview/acceptance.py \
              --image humanengine-operator-candidate:local --external-package-dir "$RUNNER_TEMP/operator-plugins" \
              --browser-smoke --evidence "$RUNNER_TEMP/package-evidence"
          else
            python3 backend/packaging/runtime-preview/acceptance.py --evidence "$RUNNER_TEMP/package-evidence"
          fi
      - name: Check out exact TypeScript origin
        if: steps.proofs.outputs.restore == 'true' || steps.proofs.outputs.bind == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: 39d8deb8922684298bab8ecb139be04555e8474a
          path: .migration-legacy
          persist-credentials: false
      - name: Build the pinned TypeScript rollback image (no push)
        if: steps.proofs.outputs.restore == 'true' || steps.proofs.outputs.bind == 'true'
        run: |
          legacy=.migration-legacy
          revision=$(git -C "$legacy" rev-parse HEAD)
          docker build --platform linux/amd64 --label org.opencontainers.image.revision="$revision" -t humanengine-drill-ts:local "$legacy"
      - name: Verify packaged migration and restore (no push)
        if: steps.proofs.outputs.restore == 'true'
        run: |
          legacy=.migration-legacy
          revision=$(git -C "$legacy" rev-parse HEAD)
          docker build --platform linux/amd64 --target build --label org.opencontainers.image.revision="$revision" -t humanengine-drill-ts-tools:local "$legacy"
          python3 backend/packaging/runtime-preview/migration_drill.py \
            --ts-image humanengine-drill-ts:local \
            --ts-tools-image humanengine-drill-ts-tools:local \
            --go-image humanengine-go-preview:local --go-revision "$GITHUB_SHA" \
            --external-snow-image humanengine-go-external:local --external-snow-package "$RUNNER_TEMP/snowluma-preview" \
            --evidence "$RUNNER_TEMP/package-evidence/migration-drill.json"
      - name: Rehearse actual Compose stop and cold reopen
        if: steps.proofs.outputs.compose == 'true' && !cancelled() && steps.external-host.outcome == 'success' && steps.snow-package.outcome == 'success'
        run: |
          (cd backend && CGO_ENABLED=0 go test -buildvcs=false -c \
            -o "$RUNNER_TEMP/snow-stop-fixture" ./internal/testsupport/snowstop)
          python3 backend/packaging/runtime-preview/compose_rehearsal.py \
            --image humanengine-go-external:local --external-snow-package "$RUNNER_TEMP/snowluma-preview" \
            --snow-fixture "$RUNNER_TEMP/snow-stop-fixture" \
            --evidence "$RUNNER_TEMP/package-evidence/compose-rehearsal.json"
      - name: Rehearse operator-shaped data bind with Go and TypeScript rollback
        if: steps.proofs.outputs.bind == 'true'
        run: |
          python3 backend/packaging/runtime-preview/bind_compose_drill.py \
            --ts-image humanengine-drill-ts:local --go-image humanengine-operator-candidate:local \
            --go-revision "$GITHUB_SHA" --external-package-dir "$RUNNER_TEMP/operator-plugins" \
            --evidence "$RUNNER_TEMP/package-evidence/bind-compose-drill.json"
      - name: Match Chromium and Compose to the same operator artifacts
        if: steps.proofs.outputs.browser == 'true' && steps.proofs.outputs.bind == 'true'
        run: |
          python3 - "$RUNNER_TEMP/package-evidence" <<'PYVERIFY'
          import json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          browser = json.loads((root / "result.json").read_text())
          bind = json.loads((root / "bind-compose-drill.json").read_text())
          assert browser["revision"] == bind["go_revision"] == os.environ["GITHUB_SHA"]
          assert browser["status"] == browser["browser"]["status"] == bind["status"] == "passed"
          assert browser["image"] == bind["images"]["go"] and browser["external_packages"] == bind["external_packages"]
          assert len(browser["external_packages"]) == 4
          assert {"action": "operator-four-external-v2-plugin-badges", "status": 200} in browser["browser"]["outcomes"]
          assert "operator-bind-four-external-packages-and-active-synthetic-snowluma" in bind["checks"]
          print("same-external-only-image-and-four-package-digests-chromium-and-compose")
          PYVERIFY
      - name: Preserve synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-package-preview-evidence
          path: ${{ runner.temp }}/package-evidence
          if-no-files-found: warn
