name: Paired packaged receive-only benchmark

on:
  workflow_dispatch:
  push:
    branches: [feat/refactor-golang]
    paths:
      - 'backend/packaging/runtime-preview/receive_load_fixture.py'
      - 'backend/internal/sourceevents/*.go'
      - 'backend/internal/jsjson/*.go'
      - 'backend/internal/httpapi/publication*.go'
      - 'backend/internal/httpapi/meme_routes.go'
      - 'backend/internal/httpapi/server.go'
      - 'backend/internal/memeservice/http_publication.go'
      - 'backend/internal/app/application.go'
      - 'backend/internal/app/external_adapter.go'
      - 'backend/internal/externaladapter/onebot_profiles.go'
      - 'backend/internal/scenestore/profile.go'
      - 'backend/plugins/snowluma/portable-http/**'
      - 'backend/packaging/runtime-preview/packaged_mixed_benchmark.py'
      - '.github/workflows/golang-package-receive-benchmark.yml'

permissions:
  contents: read

jobs:
  paired-receive:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GO_RECEIVE_BASELINE: cec2ed75af06c0a207be6e29bad7bb5ce1355274
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build the exact external-only image and four separate packages
        run: |
          dir="$RUNNER_TEMP/operator-plugins"
          make -C backend wasm-snowluma-http-preview SNOW_HTTP_PACKAGE_DIR="$dir"
          make -C backend wasm-typing-delay-package TYPING_DELAY_PACKAGE_DIR="$dir"
          make -C backend wasm-web-read-request-package WEB_READ_REQUEST_PACKAGE_DIR="$dir"
          make -C backend wasm-web-search-structured-package WEB_SEARCH_PROFILE=routed-profile.json WEB_SEARCH_STRUCTURED_PACKAGE_DIR="$dir"
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg PREVIEW_PLUGIN_PROFILE=external-only \
            -f backend/packaging/runtime-preview/Dockerfile -t humanengine-receive-go:local .
          test "$(docker run --rm --network none humanengine-receive-go:local --inspect-builtins)" = '[]'
      - name: Check out the exact TypeScript behavioral reference
        uses: actions/checkout@v7.0.1
        with:
          ref: 39d8deb8922684298bab8ecb139be04555e8474a
          path: .benchmark-typescript
          persist-credentials: false
      - name: Build the exact TypeScript runtime and fixture tools
        run: |
          legacy=.benchmark-typescript
          revision=$(git -C "$legacy" rev-parse HEAD)
          test "$revision" = 39d8deb8922684298bab8ecb139be04555e8474a
          docker build --platform linux/amd64 --label org.opencontainers.image.revision="$revision" -t humanengine-receive-ts:local "$legacy"
          docker build --platform linux/amd64 --target build --label org.opencontainers.image.revision="$revision" -t humanengine-receive-tools:local "$legacy"
      - name: Check out the exact Go receive reference
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.GO_RECEIVE_BASELINE }}
          path: .benchmark-go-baseline
          persist-credentials: false
      - name: Package the exact Go reference with the external-only profile
        run: |
          legacy=.benchmark-go-baseline
          revision=$(git -C "$legacy" rev-parse HEAD)
          test "$revision" = "$GO_RECEIVE_BASELINE"
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$revision" \
            --build-arg PREVIEW_PLUGIN_PROFILE=external-only \
            -f "$legacy/backend/packaging/runtime-preview/Dockerfile" -t humanengine-receive-go-baseline:local "$legacy"
          test "$(docker run --rm --network none humanengine-receive-go-baseline:local --inspect-builtins)" = '[]'
      - name: Measure equal receive-only traffic and assert no model calls or sends
        run: |
          python3 backend/packaging/runtime-preview/packaged_mixed_benchmark.py \
            --ts-image humanengine-receive-ts:local --ts-tools-image humanengine-receive-tools:local \
            --go-image humanengine-receive-go:local --go-revision "$GITHUB_SHA" \
            --receive-only --external-snow-package "$RUNNER_TEMP/operator-plugins" \
            --evidence "$RUNNER_TEMP/humanengine-paired-receive.json"
      - name: Measure Go before and after on the same runner and plugin bytes
        run: |
          python3 backend/packaging/runtime-preview/packaged_mixed_benchmark.py \
            --ts-image humanengine-receive-ts:local --ts-tools-image humanengine-receive-tools:local \
            --go-image humanengine-receive-go:local --go-revision "$GITHUB_SHA" \
            --go-baseline-image humanengine-receive-go-baseline:local \
            --go-baseline-revision "$GO_RECEIVE_BASELINE" \
            --receive-only --external-snow-package "$RUNNER_TEMP/operator-plugins" \
            --evidence "$RUNNER_TEMP/humanengine-paired-go-receive.json"
      - name: Measure captioned image intake without model or send work
        run: |
          python3 backend/packaging/runtime-preview/packaged_mixed_benchmark.py \
            --ts-image humanengine-receive-ts:local --ts-tools-image humanengine-receive-tools:local \
            --go-image humanengine-receive-go:local --go-revision "$GITHUB_SHA" \
            --receive-only --receive-images --external-snow-package "$RUNNER_TEMP/operator-plugins" \
            --evidence "$RUNNER_TEMP/humanengine-paired-image-receive.json"
      - name: Preserve aggregate benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-packaged-receive-benchmark
          path: |
            ${{ runner.temp }}/humanengine-paired-receive.json
            ${{ runner.temp }}/humanengine-paired-go-receive.json
            ${{ runner.temp }}/humanengine-paired-image-receive.json
          if-no-files-found: ignore
