name: Go external HTTP upgrade receipt

on:
  workflow_dispatch:
  push:
    branches: [feat/refactor-golang]
    paths:
      - '.github/workflows/golang-package-structured-http.yml'
      - 'backend/internal/app/external_web_read_test.go'
      - 'backend/internal/app/external_web_request_test.go'
      - 'backend/internal/app/external_web_upgrade_test.go'
      - 'backend/internal/pluginmanager/public_get.go'
      - 'backend/internal/pluginmanager/external_v2.go'
      - 'backend/internal/publicpage/**'
      - 'backend/internal/httpwire/**'
      - 'backend/internal/httpmedia/**'
      - 'backend/plugins/web-read/**'

permissions:
  contents: read

jobs:
  structured-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build both independent HTTP packages and one native fixture image
        run: |
          make -C backend wasm-web-read-get-package WEB_READ_GET_PACKAGE_DIR="$RUNNER_TEMP/independent-page-plugin"
          make -C backend wasm-web-read-request-package WEB_READ_REQUEST_PACKAGE_DIR="$RUNNER_TEMP/independent-request-plugin"
          docker build --platform linux/amd64 --target build -f backend/packaging/runtime-preview/Dockerfile -t humanengine-request-fixture:local .
          mkdir "$RUNNER_TEMP/request-test-build"
          docker run --rm \
            --mount "type=bind,source=$RUNNER_TEMP/request-test-build,target=/request-test-build" \
            --entrypoint sh humanengine-request-fixture:local -ec '
              cd /src/backend
              . .native-build/icu/env.sh
              go test -race -tags sqlite_fts5,humanengine_icu -c -o /request-test-build/request-fixture ./internal/app
            '
      - name: Prove cold upgrade, exact cached bytes and cold rollback
        run: |
          set -euo pipefail
          net="he-structured-http-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          peer="$net-peer"
          proof="$RUNNER_TEMP/request-receipt.txt"
          cleanup() {
            docker rm -f "$peer" >/dev/null 2>&1 || true
            docker network rm "$net" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # Only a synthetic peer can be contacted; the host still applies its
          # normal public-IP admission and literal dial within this bridge.
          docker network create --internal --subnet 192.0.1.0/29 "$net"
          entity="$RUNNER_TEMP/encoded-fixture.gz"
          python3 -c 'import gzip,random,sys; open(sys.argv[1],"wb").write(gzip.compress(random.Random(217).randbytes((1<<20)+16384),mtime=0))' "$entity"
          test "$(wc -c < "$entity")" -gt 1048576
          docker run -d --name "$peer" --network "$net" --ip 192.0.1.2 \
            --mount "type=bind,source=$entity,target=/entity.gz,readonly" \
            --entrypoint node humanengine-request-fixture:local -e '
            const net = require("node:net"), fs = require("node:fs");
            const entity = fs.readFileSync("/entity.gz");
            const html = Buffer.from("<html><head><title>Fixture title</title></head><body><h1>Public fixture heading</h1><p>" +
              "x".repeat(9000) + "缓存中的准确字节" + "</p></body></html>");
            net.createServer((conn) => {
              let request = "";
              conn.on("data", function read(data) {
                request += data.toString("latin1");
                if (!request.includes("\r\n\r\n")) return;
                conn.off("data", read);
                if (!request.startsWith("GET /manual.html HTTP/1.1\r\n") ||
                    /\r\n(?:Cookie|Authorization):/i.test(request)) {
                  console.log("unexpected-request"); conn.destroy(); return;
                }
                if (!/\r\nX-Fixture-Request:/i.test(request)) {
                  console.log("page-get");
                  conn.write("HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\nContent-Length: " +
                    html.length + "\r\nConnection: close\r\n\r\n");
                  conn.end(html); return;
                }
                if (!/\r\nAccept-Encoding: gzip\r\n/i.test(request) || !/\r\nX-Fixture-Request: exact\r\n/i.test(request)) {
                  console.log("unexpected-request"); conn.destroy(); return;
                }
                console.log("structured-get");
                conn.write("HTTP/1.1 418 Synthetic\r\nX-Fixture: first\r\nContent-Encoding: gzip\r\nx-Fixture: second\r\nContent-Type: application/octet-stream\r\nContent-Length: " +
                  entity.length + "\r\nConnection: close\r\n\r\n");
                conn.end(entity);
              });
            }).listen(41288,"0.0.0.0",()=>console.log("ready"));
          '
          for attempt in {1..50}; do
            if docker logs "$peer" | grep -qx ready; then break; fi
            sleep 0.1
          done
          docker logs "$peer" | grep -qx ready
          docker run --rm --network "$net" \
            --mount "type=bind,source=$RUNNER_TEMP/independent-page-plugin,target=/independent-page-plugin,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/independent-request-plugin,target=/independent-request-plugin,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/request-test-build,target=/request-test-build,readonly" \
            --mount "type=bind,source=$entity,target=/entity.gz,readonly" \
            -e HE_PAGE_PACKAGE=/independent-page-plugin \
            -e HE_PAGE_ORIGIN=http://192.0.1.2:41288/manual.html \
            -e HE_REQUEST_ENTITY=/entity.gz \
            -e HE_REQUEST_PACKAGE=/independent-request-plugin \
            -e HE_REQUEST_ORIGIN=http://192.0.1.2:41288/manual.html \
            -e HE_SOURCE_ROOT=/src \
            -e HE_IMAGE_LIBRARY=/src/node_modules/@img/sharp-libvips-linux-x64/lib/libvips-cpp.so.8.18.7 \
            --entrypoint sh humanengine-request-fixture:local -ec '
              cd /src/backend/internal/app
              /request-test-build/request-fixture -test.v -test.run "^TestExternalWebReadColdUpgradeRollback$"
            ' | tee "$proof"
          grep -Fq "cold-get-request-get-settings-and-intent-preserved" "$proof"
          test "$(grep -Fc "preview-and-range" "$proof")" = 2
          grep -Fq "structured-418-gzip-over-1mib-exact-range" "$proof"
          test "$(docker logs "$peer" | grep -E "^(page|structured)-get$")" = "$(printf '%s\n' page-get structured-get page-get)"
          ! docker logs "$peer" | grep -q unexpected-request
          printf '%s\n' 'one-origin-get-encoded-range-beyond-1mib' | tee -a "$proof"
      - name: Preserve synthetic HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-public-webrequest-receipt
          path: ${{ runner.temp }}/request-receipt.txt
          if-no-files-found: ignore
