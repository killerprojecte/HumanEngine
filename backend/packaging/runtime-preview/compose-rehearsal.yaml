# Explicit local-image candidate. The disposable hosted rehearsal uses this same file.
name: humanengine-go-local
services:
  humanengine:
    image: ${HE_COMPOSE_IMAGE:?Set the tested local preview image}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    ports:
      - target: 3000
        published: "${HE_COMPOSE_PORT:-3001}"
        host_ip: 127.0.0.1
    environment:
      HUMANENGINE_ADMIN_TOKEN: ${HUMANENGINE_ADMIN_TOKEN:?Set the local administration token}
      HUMANENGINE_LOG_DIR: /app/data/logs
    command:
      - --runtime-preview
      - --database
      - /app/data/humanengine.sqlite
      - --authority
      - /app/authority
      - --listen
      - 0.0.0.0:3000
      - --plugin-root
      - /app/plugins
      - --ui-root
      - /opt/humanengine/ui
      - --image-library
      - /opt/humanengine/lib/libvips-cpp.so.8.18.7
    volumes:
      - local-data:/app/data
      - local-authority:/app/authority
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  local-data:
  local-authority:
